name: terraform-ci

# Format check + validate on every PR touching the Terraform code.
# No cloud credentials needed (uses -backend=false).

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - terraform/environments/production/00-backend
          - terraform/environments/production/01-infra
          - terraform/environments/production/02-workloads
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        working-directory: ${{ matrix.stack }}
        run: terraform init -backend=false

      - name: validate
        working-directory: ${{ matrix.stack }}
        run: terraform validate
